name: Autonomous News Engine CI & Verification

on:
  push:
    paths:
      - "news_engine/**"
      - ".github/workflows/news-engine-ci.yml"
  pull_request:
    paths:
      - "news_engine/**"
  workflow_dispatch:

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r news_engine/requirements.txt

      - name: Run End-to-End System Tests
        run: |
          python news_engine/scripts/test_system.py

